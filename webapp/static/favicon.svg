<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#1a1a2e"/>

  <!-- Red top-left card -->
  <rect x="6" y="6" width="24" height="24" rx="4" fill="#c0392b"/>
  <!-- Blue top-right card -->
  <rect x="34" y="6" width="24" height="24" rx="4" fill="#2471a3"/>
  <!-- Blue bottom-left card -->
  <rect x="6" y="34" width="24" height="24" rx="4" fill="#2471a3"/>
  <!-- Red bottom-right card -->
  <rect x="34" y="34" width="24" height="24" rx="4" fill="#c0392b"/>

  <!-- White lines on cards (suggesting hidden words) -->
  <rect x="10" y="16" width="16" height="2.5" rx="1.2" fill="rgba(255,255,255,0.6)"/>
  <rect x="10" y="21" width="10" height="2.5" rx="1.2" fill="rgba(255,255,255,0.4)"/>

  <rect x="38" y="16" width="16" height="2.5" rx="1.2" fill="rgba(255,255,255,0.6)"/>
  <rect x="38" y="21" width="10" height="2.5" rx="1.2" fill="rgba(255,255,255,0.4)"/>

  <rect x="10" y="44" width="16" height="2.5" rx="1.2" fill="rgba(255,255,255,0.6)"/>
  <rect x="10" y="49" width="10" height="2.5" rx="1.2" fill="rgba(255,255,255,0.4)"/>

  <rect x="38" y="44" width="16" height="2.5" rx="1.2" fill="rgba(255,255,255,0.6)"/>
  <rect x="38" y="49" width="10" height="2.5" rx="1.2" fill="rgba(255,255,255,0.4)"/>
</svg>
